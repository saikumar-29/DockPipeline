<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Online Food Delivery</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f8f8f8;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 50px;
background:#e23744;
color:white;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
}

.search-box{
flex:1;
margin:0 30px;
position:relative;
}

.search-box input{
width:100%;
padding:12px 45px;
border:none;
outline:none;
border-radius:30px;
font-size:16px;
}

.search-box i{
position:absolute;
left:15px;
top:14px;
color:#777;
}

.cart{
font-size:20px;
cursor:pointer;
position:relative;
}

.cart-count{
position:absolute;
top:-10px;
right:-10px;
height:20px;
width:20px;
background:white;
color:#e23744;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* Hero */

.hero{
height:400px;
background:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1600') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-content{
background:rgba(0,0,0,0.5);
padding:30px;
border-radius:20px;
}

.hero h1{
font-size:55px;
margin-bottom:10px;
}

.hero p{
font-size:20px;
}

/* Categories */

.categories{
padding:40px;
}

.categories h2{
margin-bottom:20px;
}

.category-list{
display:flex;
gap:20px;
overflow-x:auto;
}

.category{
background:white;
padding:15px;
border-radius:15px;
text-align:center;
min-width:120px;
cursor:pointer;
transition:.3s;
box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.category:hover{
transform:translateY(-5px);
background:#e23744;
color:white;
}

/* Food Cards */

.food-section{
padding:40px;
}

.food-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.card-body h3{
margin-bottom:8px;
}

.price{
color:#e23744;
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.rating{
color:orange;
}

.btn{
width:100%;
padding:12px;
background:#e23744;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:.3s;
}

.btn:hover{
background:#c61c29;
}

.sidebar{
position:fixed;
right:-400px;
top:0;
width:350px;
height
