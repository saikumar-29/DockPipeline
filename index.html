<!DOCTYPE html>
<html>
<head>
    <title>Food Ordering App</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
        }

        h1{
            color:#ff5722;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            padding:20px;
            width:200px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        button{
            background:#ff5722;
            color:white;
            border:none;
            padding:10px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#e64a19;
        }

        #cart{
            margin:20px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>
<body>

    <h1>🍔 Food Ordering App</h1>

    <div id="cart">
        Cart Items: <span id="count">0</span>
    </div>

    <div class="container">

        <div class="card">
            <h2>Pizza</h2>
            <p>₹299</p>
            <button onclick="addItem()">Add to Cart</button>
        </div>

        <div class="card">
            <h2>Burger</h2>
            <p>₹149</p>
            <button onclick="addItem()">Add to Cart</button>
        </div>

        <div class="card">
            <h2>Biryani</h2>
            <p>₹249</p>
            <button onclick="addItem()">Add to Cart</button>
        </div>

    </div>

    <script>
        let count = 0;

        function addItem() {
            count++;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
